<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0c0f" />
  <meta
    name="description"
    content="Cantact Patch — an open-city driving simulator in the browser: 240 Hz vehicle dynamics, real imported car models, live multiplayer rooms and a city that wakes up at dusk."
  />
  <title>CANTACT PATCH · Open City Driving</title>

  <!-- CrazyGames SDK (v3). It only answers on CrazyGames and on localhost;
       everywhere else it reports "disabled" and every call in
       src/lib/crazygames.ts becomes a no-op, so the game runs unchanged. -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Mobile shells: no long-press magnifier, no text selection, no rubber-band
       scroll of the page behind the canvas. -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0b0c0f;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #root {
      height: 100dvh;
    }

    /* the loading screen, painted before the bundle is parsed */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: radial-gradient(ellipse 60% 50% at 50% 45%, #101827, #0b0c0f 70%);
      color: #ff6a2a;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.32em;
    }

    /* the mark: white letterforms, blue keyline, the same bloom as the SVG */
    #boot .mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.05em;
      font-family: "Rajdhani", ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(34px, 9vw, 56px);
      line-height: 0.94;
      letter-spacing: 0.04em;
      color: #ffffff;
      -webkit-text-stroke: 1.6px rgba(143, 182, 230, 0.95);
      text-shadow: 0 0 22px rgba(143, 182, 230, 0.55);
    }

    #boot .note {
      color: #6f7783;
      font-size: 10px;
      letter-spacing: 0.34em;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="boot">
    <span class="mark"><span>CANTACT</span><span>PATCH</span></span>
    <span class="note">LOADING</span>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
